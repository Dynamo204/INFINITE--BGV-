applications:
  - name: bgv-backend
    memory: 512M
    disk_quota: 1G
    instances: 1
    routes:
      - route: bgv-backend.cfapps.us10-001.hana.ondemand.com
    buildpacks:
      - nodejs_buildpack
    command: npm start
    health-check-type: http
    health-check-http-endpoint: /api/health
    env:
      NODE_ENV: production
